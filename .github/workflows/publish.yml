# Publish takehome-ca to npm (provenance) and PyPI (Trusted Publishing).
# Trigger: GitHub Release. OIDC only — no long-lived npm or PyPI token.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  BINARYEN_VERSION: "132"

jobs:
  publish-npm:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}

      - name: Cache pinned binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/binaryen-version_${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ env.BINARYEN_VERSION }}-${{ runner.os }}

      - name: Install and assert pinned binaryen
        run: |
          bash scripts/install-binaryen.sh
          bash scripts/check-binaryen-version.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: WASM / native identity
        run: bash packages/takehome-js/scripts/test.sh

      - name: WASM hash matches the release claim
        run: bash scripts/check-wasm-hash.sh

      - name: WASM contains no builder home paths
        run: bash scripts/check-wasm-paths.sh

      - name: npm ci
        working-directory: packages/takehome-js
        run: npm ci

      - name: npm publish --provenance
        working-directory: packages/takehome-js
        run: npm publish --provenance --access public

      - name: cargo-sbom
        run: |
          cargo install cargo-sbom --locked
          cargo sbom > sbom-cargo.spdx.json

      - name: cyclonedx-npm
        working-directory: packages/takehome-js
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file "${{ github.workspace }}/sbom-takehome-js.cdx.json"

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom-cargo.spdx.json \
            sbom-takehome-js.cdx.json \
            --clobber

  publish-pypi:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: packages/takehome-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          maturin build --release --out dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/takehome-py/dist
