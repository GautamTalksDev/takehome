# .github/workflows/rules-watch.yml
# Spec §12.3: pin the T4127 index, current edition pages, and CSV bundle.
# Fetch, canonicalize, hash, open an issue with the unified diff on drift.
name: rules-watch

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-watch
  cancel-in-progress: true

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/rules-watch/package-lock.json
      - name: Compare T4127 pins
        working-directory: tools/rules-watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm ci && node src/cli.js
