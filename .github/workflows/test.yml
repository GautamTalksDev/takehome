# .github/workflows/test.yml
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default token is read-only. Jobs that need more must say so (A03:2025).
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BINARYEN_VERSION: "132"

jobs:
  tracked-ban:
    # Durable fix for the commit that tracked a maturin .so and .pyc files.
    # Secret files and generated paths must not re-enter HEAD.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ban tracked secrets and generated artifacts
        run: ./scripts/tracked-ban.sh

  float-ban:
    # Runs first and independently. If binary floating point reaches a money
    # path, nothing else about this build matters.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ban IEEE-754 in money paths
        run: ./scripts/float-ban.sh
      - name: Ban float-producing dependencies in takehome-core
        run: |
          # rust_decimal's float features would reintroduce a conversion path.
          if grep -nE 'rust_decimal.*features.*float' crates/takehome-core/Cargo.toml; then
            echo "rust_decimal float feature enabled in takehome-core" >&2
            exit 1
          fi
          echo "dependency float-ban: clean"

  docs-lint:
    # House style is enforced, not suggested (em dashes, banned words, openings).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Docs house-style unit tests
        run: node --test scripts/docs-lint.test.mjs
      - name: Docs lint
        run: ./scripts/docs-lint.sh
      - name: Diagram captions present
        run: node scripts/check-diagram-captions.mjs
      - name: Link check (internal; external on main)
        run: node scripts/link-check.mjs --skip-external

  name-ban:
    # Retired product name. Historical notes are the only permitted leftover
    # hits (CHANGELOG, CONFORMANCE, ADRs, findings).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ban leftover retired product name
        run: ./scripts/name-ban.sh

  sql-ban:
    # A05:2025 — concatenated SQL is injection. D1 stays prepare()+bind().
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ban string-concatenated SQL
        run: ./scripts/sql-ban.sh

  supply-chain-ban:
    # A03:2025 items 20–26: SHA-pinned actions, job permissions, lockfiles,
    # npm ci, Dependabot, OIDC publish, SBOM. A tag-pinned action fails here.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Supply-chain file checks
        run: node --test services/api/tests/51-supply-chain.test.js

  npm-audit:
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/api
          - web/site
          - packages/takehome-js
          - tools/pdoc-oracle
          - tools/rules-watch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: npm ci && npm audit --audit-level=high
        working-directory: ${{ matrix.package }}
        run: |
          npm ci
          npm audit --audit-level=high

  pip-audit:
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit takehome-py
        working-directory: packages/takehome-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit maturin pytest
          pip-audit

  build-test:
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - name: Assert pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo +1.90.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.90.0 test --workspace --all-features

      - name: Conformance report current
        run: cargo run -p takehome-conformance -- --check

      - name: Test (release, catches overflow-behaviour divergence)
        run: cargo test --workspace --release

      - name: Determinism check
        # Same inputs, same rule set, byte-identical output. Run the suite twice
        # with a different seed environment and diff the golden vector output.
        run: |
          cargo test --workspace -- --nocapture > /tmp/run1.txt 2>&1
          cargo test --workspace -- --nocapture > /tmp/run2.txt 2>&1
          grep -c 'test result: ok' /tmp/run1.txt
          diff <(grep 'test result' /tmp/run1.txt) <(grep 'test result' /tmp/run2.txt)

  wasm-js:
    # Spec §5.4: WASM and native are the same engine. If they disagree, every
    # downstream runtime claim is marketing.
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}

      - name: Cache pinned binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/binaryen-version_${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ env.BINARYEN_VERSION }}-${{ runner.os }}

      - name: Install and assert pinned binaryen
        run: |
          bash scripts/install-binaryen.sh
          bash scripts/check-binaryen-version.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/takehome-js/package-lock.json

      - name: npm ci
        working-directory: packages/takehome-js
        run: npm ci

      - name: WASM / native identity + gzip size
        run: bash packages/takehome-js/scripts/test.sh

      - name: WASM hash matches the release claim
        run: bash scripts/check-wasm-hash.sh

      - name: WASM contains no builder home paths
        run: bash scripts/check-wasm-paths.sh

  python:
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0

      - name: Assert pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel, install into clean venv, run vector tests
        working-directory: packages/takehome-py
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin build --release -o dist
          wheel="$(ls dist/takehome_ca-*.whl | head -n1)"
          test -n "$wheel" && test -f "$wheel"
          .venv/bin/pip install "$wheel"
          .venv/bin/pytest -q

      - name: sdist rebuilds from vendored rules
        run: bash scripts/check-sdist.sh

  site:
    # Spec §5.5 / §13.3: the calculator works offline, matches the engine, and
    # makes no network request during a calculation.
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}

      - name: Cache pinned binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/binaryen-version_${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ env.BINARYEN_VERSION }}-${{ runner.os }}

      - name: Install and assert pinned binaryen
        run: |
          bash scripts/install-binaryen.sh
          bash scripts/check-binaryen-version.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/site/package-lock.json

      - name: Native CLI
        run: cargo build -p takehome-cli --release

      - name: Install site tooling
        working-directory: web/site
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web/site
        run: npx playwright install --with-deps chromium

      - name: Calculator Playwright, JS budget, Lighthouse
        working-directory: web/site
        run: npm test
        env:
          TAKEHOME_CLI: ${{ github.workspace }}/target/release/takehome
          ASTRO_TELEMETRY_DISABLED: "1"

  api:
    # Spec §10.2 tests 11–26: Worker JSON API, keys, metering, billing, five-minute path.
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}

      - name: Cache pinned binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/binaryen-version_${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ env.BINARYEN_VERSION }}-${{ runner.os }}

      - name: Install and assert pinned binaryen
        run: |
          bash scripts/install-binaryen.sh
          bash scripts/check-binaryen-version.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: WASM module
        run: bash packages/takehome-js/scripts/build.sh

      - name: Worker contract tests 11–26
        working-directory: services/api
        run: npm ci && npm test && npm run test:d1

  security:
    # A10:2025 Gate 2. Exceptional conditions (items 51–55).
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}

      - name: Cache pinned binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/binaryen-version_${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ env.BINARYEN_VERSION }}-${{ runner.os }}

      - name: Install and assert pinned binaryen
        run: |
          bash scripts/install-binaryen.sh
          bash scripts/check-binaryen-version.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: WASM module
        run: bash packages/takehome-js/scripts/build.sh

      - name: Exceptional-conditions tests 51–55
        working-directory: services/api
        run: npm ci && npm run test:security

  rules-watch:
    # Spec §12.3: pin T4127 sources, canonicalize, hash, issue on drift.
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/rules-watch/package-lock.json
      - name: Rules-watch fixture tests
        working-directory: tools/rules-watch
        run: npm ci && npm test

  deny:
    needs: [tracked-ban, float-ban, docs-lint, name-ban, supply-chain-ban, sql-ban]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Engine is Apache-2.0. Nothing copyleft may enter the dependency tree.
          command: check licenses bans advisories
