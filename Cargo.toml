[workspace]
resolver = "2"
members = ["crates/netpay-core", "crates/netpay-wasm", "crates/netpay-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/netpay-ca/netpay"
rust-version = "1.90"

[workspace.dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str", "maths"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
