[workspace]
resolver = "2"
members = [
    "crates/takehome-core",
    "crates/takehome-wasm",
    "crates/takehome-cli",
    "tools/ingest",
    "tools/grid-gen",
    "tools/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/takehome-ca/takehome"
rust-version = "1.90"

[workspace.dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str", "maths"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
serde_path_to_error = "0.1"
wasm-bindgen = "=0.2.128"

# Used only for the wasm32 module. Does not change `cargo test --release`.
[profile.release]
strip = "debuginfo"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
