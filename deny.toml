# deny.toml — place at repo root. Keeps copyleft out of an Apache-2.0 engine.
[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
deny = []

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
