[package]
name = "takehome-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/takehome-ca/takehome"
rust-version = "1.90"
publish = false
description = "Python bindings for takehome-core. Same JSON calculate() wire as WASM."
include = [
  "src/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
takehome-core = { path = "../../crates/takehome-core" }
pyo3 = { version = "0.23.4", features = ["abi3-py39"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

# Independent of the repo workspace so `cargo test --workspace` does not link Python.
[workspace]
