[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "takehome-ca"
version = "0.1.0"
description = "Canadian payroll deductions. Same T4127 engine as native Rust."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Takehome" }]
keywords = ["payroll", "canada", "t4127", "cpp", "ei"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/takehome-ca/takehome"
Repository = "https://github.com/takehome-ca/takehome"

[tool.maturin]
python-source = "python"
module-name = "takehome_ca._native"
features = ["extension-module"]
manifest-path = "Cargo.toml"
