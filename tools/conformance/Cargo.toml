[package]
name = "takehome-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Generate CONFORMANCE.md and conformance.json from a measured run (spec §11.4)."

[[bin]]
name = "takehome-conformance"
path = "src/main.rs"

[dependencies]
takehome-core = { path = "../../crates/takehome-core" }
takehome-grid-gen = { path = "../grid-gen" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
