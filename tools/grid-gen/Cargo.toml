[package]
name = "takehome-grid-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic T4127 conformance grid (spec §11.2). Same seed, same grid, forever."
build = "build.rs"

[[bin]]
name = "takehome-grid-gen"
path = "src/main.rs"

[dependencies]
takehome-core = { path = "../../crates/takehome-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
